name: Nightly journeys

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # A called workflow can only keep or reduce its caller's token permissions,
    # and Verify's plan job reads Actions runs for the main short-circuit.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify.yml
    with:
      tier: all
      timeout: 45
